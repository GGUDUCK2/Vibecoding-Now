name: VibeCoding Now Auto Publish

on:
  schedule:
    # UTC 기준 (KST = UTC + 9)
    # 컬럼: 07:00 KST = 22:00 UTC (전날)
    - cron: '50 21 * * *'
    # Tips 개념: 12:00 KST = 03:00 UTC
    - cron: '50 2 * * *'
    # Tips 실전: 19:00 KST = 10:00 UTC
    - cron: '50 9 * * *'
  
  workflow_dispatch:
    inputs:
      category:
        description: '발행 카테고리'
        required: true
        type: choice
        options:
          - column
          - tips-concept
          - tips-practical
      dry_run:
        description: 'Dry-run 모드 (실제 발행 안함)'
        required: false
        type: boolean
        default: false

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  BLOGGER_CREDENTIALS: ${{ secrets.BLOGGER_CREDENTIALS }}
  BLOG_ID: ${{ secrets.BLOG_ID }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Determine category from schedule
        id: determine-category
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "category=${{ inputs.category }}" >> $GITHUB_OUTPUT
            echo "dry_run=${{ inputs.dry_run }}" >> $GITHUB_OUTPUT
          else
            # 스케줄 기반 카테고리 결정 (cron 시간 기준)
            HOUR=$(date -u +%H)
            if [ "$HOUR" == "21" ] || [ "$HOUR" == "22" ]; then
              echo "category=column" >> $GITHUB_OUTPUT
            elif [ "$HOUR" == "02" ] || [ "$HOUR" == "03" ]; then
              echo "category=tips-concept" >> $GITHUB_OUTPUT
            else
              echo "category=tips-practical" >> $GITHUB_OUTPUT
            fi
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Pull latest cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main || true
      
      - name: Run automation
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ steps.determine-category.outputs.dry_run }}" == "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          
          python src/main.py \
            --category ${{ steps.determine-category.outputs.category }} \
            $DRY_RUN_FLAG
      
      - name: Commit and push cache updates
        run: |
          git add cache/processed.json
          git diff --staged --quiet || git commit -m "Update processed cache [skip ci]"
          git push || echo "Nothing to push"
